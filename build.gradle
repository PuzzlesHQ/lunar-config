plugins {
    id 'java'
    id("io.github.sgtsilvio.gradle.maven-central-publishing") version "0.4.0"
    id 'maven-publish'
}

def ref = System.getenv("GITHUB_REF")

group = p_group
version = ((ref == null) ? "refs/tags/" + p_version : ref).replaceAll("refs/tags/", "")

String mavenUrl = System.getenv("MAVEN_URL")

String envRepo = System.getenv("MAVEN_REPO");
String mavenRepo = envRepo != null ? envRepo : "releases";

java {
    sourceCompatibility = '8'
    targetCompatibility = '8'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly "org.jetbrains:annotations:24.0.0"
    implementation "com.electronwill.night-config:toml:$toml_version"
}

java {
    withJavadocJar()
    withSourcesJar()

    sourceCompatibility = '8'
    targetCompatibility = '8'
}

publishing {
    repositories {
        maven {
            name = "PuzzleHQsMaven"
            url = mavenUrl+ "/" +mavenRepo
            credentials {
                username = System.getenv("MAVEN_NAME")
                password = System.getenv("MAVEN_SECRET")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        maven(MavenPublication) {
            groupId = p_group
            artifactId = p_id

            from components.java

            artifact source: jar, extension: 'jar'

            pom {
                name = p_name
                description = p_desc
                url = p_git

                licenses {
                    license {
                        name = "GNU Lesser General Public License"
                        url = "https://www.gnu.org/licenses/lgpl-3.0.html"
                        distribution = "LGPL"
                        comments = "This project includes LGPL-licensed components."
                    }
                }

                developers {
                    developer {
                        id = 'mrzombii'
                        name = 'Mr Zombii'
                        email = 'thezombiigames@gmail.com'
                    }
                }
                scm {
                    connection = "${p_git}.git"
                    developerConnection = "${p_git}.git"
                    url = "${p_git}.git"
                }
            }
        }
    }
}

if (ref != null) {
    signing {
        useGpgCmd()
        sign(publishing.publications[0])
    }
}

wrapper {
    gradleVersion = "8.14"
    distributionType = Wrapper.DistributionType.ALL
}

wrapper {
    gradleVersion = "8.14"
    distributionType = Wrapper.DistributionType.ALL
}